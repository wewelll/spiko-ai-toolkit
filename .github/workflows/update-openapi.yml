name: Update Spiko OpenAPI clients

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm specs:update
      - run: pnpm check:code
      - run: pnpm build
      - name: Open or update the generated client pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Spiko's OpenAPI specifications are unchanged."
            exit 0
          fi

          branch="automation/update-spiko-openapi"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add openapi \
            packages/public-api-client/src/generated.ts \
            packages/investor-api-client/src/generated.ts \
            packages/distributor-api-client/src/generated.ts \
            apps/cli/src/generated/operations.ts
          git commit -m "Update generated Spiko API clients"
          git push --force-with-lease origin "HEAD:$branch"

          gh pr view "$branch" >/dev/null 2>&1 || gh pr create \
            --base main \
            --head "$branch" \
            --title "Update generated Spiko API clients" \
            --body "Automated weekly refresh of Spiko's OpenAPI specifications and Effect HTTP clients."
