name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: github.repository_owner == 'wewelll'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Ensure the Changesets token is used when updating the release branch.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11
      # v2 is required for @changesets/cli v3: it reads the structured
      # CHANGESETS_OUTPUT file instead of scraping "New tag:" stdout lines,
      # which is how git tags and GitHub releases actually get created.
      - name: Create release pull request or publish
        uses: changesets/action@v2 # v2.1.1 at time of writing
        with:
          version-script: pnpm changeset-version
          publish-script: pnpm changeset-publish
        env:
          # No PAT is configured; the default token suffices once the repo
          # setting "Allow GitHub Actions to create and approve pull requests"
          # is enabled.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
